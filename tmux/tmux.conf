# neomux — tmux entry point
# Sources modular config files from the same directory.
# Layout: this file lives at ~/.config/tmux/tmux.conf (via symlink).

source-file ~/.config/tmux/options.conf
source-file ~/.config/tmux/keybindings.conf
source-file ~/.config/tmux/theme.conf
source-file ~/.config/tmux/plugins.conf
