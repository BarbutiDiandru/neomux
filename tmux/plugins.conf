# -----------------------------------------------------------------------------
# Plugins (managed by TPM)
# -----------------------------------------------------------------------------
# Install with prefix + I, update with prefix + U, uninstall with prefix + alt-u.
# TPM lives in ~/.config/tmux/plugins/tpm — the install script handles that.

set-environment -g TMUX_PLUGIN_MANAGER_PATH "~/.config/tmux/plugins/"

# Core
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Copy/paste + navigation
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Session persistence: prefix + Ctrl-s to save, prefix + Ctrl-r to restore.
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @resurrect-strategy-nvim 'session'

# Theme
set -g @plugin 'catppuccin/tmux#v2.1.3'
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_window_current_text ' #W'
set -g @catppuccin_window_text ' #W'
set -g status-right '#{E:@catppuccin_status_application}#{E:@catppuccin_status_session}'

# Boot TPM — must be last.
run '~/.config/tmux/plugins/tpm/tpm'
