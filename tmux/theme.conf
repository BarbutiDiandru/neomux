# -----------------------------------------------------------------------------
# Status bar / visual theme
# -----------------------------------------------------------------------------
# Minimal built-in theme. Catppuccin (loaded in plugins.conf) overrides this
# once plugins are installed; this is the fallback for a fresh clone.

set -g status-position top
set -g status-interval 5
set -g status-justify left

set -g status-style           "fg=white,bg=default"
set -g status-left-length     40
set -g status-right-length    80

set -g status-left            "#[fg=green,bold]#S #[fg=white,nobold]| "
set -g status-right           "#[fg=cyan]#H #[fg=white]| #[fg=yellow]%Y-%m-%d %H:%M"

setw -g window-status-format         " #I:#W "
setw -g window-status-current-format "#[fg=black,bg=cyan,bold] #I:#W "

# Pane borders.
set -g pane-border-style        "fg=brightblack"
set -g pane-active-border-style "fg=magenta"

# Message/prompt.
set -g message-style "fg=black,bg=yellow,bold"
