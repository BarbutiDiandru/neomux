# -----------------------------------------------------------------------------
# Base options
# -----------------------------------------------------------------------------

# Prefix: C-Space (no shell conflict, easy chord). Keep C-b as fallback.
unbind C-b
set -g prefix C-f
bind C-f send-prefix

# enable terminal focus events
set-option -g focus-events on

# True color + italics support in modern terminals.
set -g default-terminal "tmux-256color"

# Window/pane indexing starts at 1; renumber on close.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# status bar
set -g status on
set -g status-position top
set -g status-interval 5

# Responsiveness.
set -s escape-time 0
set -g history-limit 250000
set -g focus-events on
set -g repeat-time 500

# Mouse + system clipboard.
set -g mouse on
set -g set-clipboard on

# Copy mode uses vi keys.
set-window-option -g mode-keys vi
set -g status-keys emacs

# Don't kill the client when the last session closes.
set -g detach-on-destroy off

# Aggressive resize plays nicely with multiple clients on different sizes.
setw -g aggressive-resize on

# left and right status bar defaults
set -g status-left-length     100
set -g status-right-length    100

set -g status-left    "#[fg=white]|"
set -g status-right   "#[fg=white]| #[fg=yellow]%Y-%m-%d %H:%M"
set -g status-justify "absolute-centre"

# status left look and feel
# prefix flag
set -ga status-left "#{?client_prefix,#{#[bg=#{@thm_green},fg=#{@thm_bg},bold]  C-f on },#{#[bg=#{@thm_bg},fg=#{@thm_red}]  C-f off }}"
## current dir flag
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_blue}]  #{=/-32/...:#{s|$USER|~|:#{b:pane_current_path}}} "
## zoom flag
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_overlay_0},none]#{?window_zoomed_flag,│,}"
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_yellow}]#{?window_zoomed_flag,  zoom ,}"

set -ga status-left  "#[fg=white]|"
# inactive window string format
setw -g window-status-format         " #I:off "
# active window string format
setw -g window-status-current-format "#[fg=black,bg=cyan,bold] #I:on "

# Pane borders.
set -g pane-border-style        "fg=brightblack"
set -g pane-active-border-style "fg=magenta"

# Message/prompt.
set -g message-style "fg=black,bg=yellow,bold"
