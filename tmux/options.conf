# -----------------------------------------------------------------------------
# Base options
# -----------------------------------------------------------------------------

# Prefix: C-Space (no shell conflict, easy chord). Keep C-b as fallback.
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# True color + italics support in modern terminals.
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -ag terminal-overrides ",alacritty:RGB"
set -ag terminal-overrides ",wezterm:RGB"

# Window/pane indexing starts at 1; renumber on close.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Responsiveness.
set -s escape-time 0
set -g history-limit 100000
set -g focus-events on
set -g repeat-time 500

# Mouse + system clipboard.
set -g mouse on
set -g set-clipboard on

# Copy mode uses vi keys.
setw -g mode-keys vi
set -g status-keys emacs

# Don't kill the client when the last session closes.
set -g detach-on-destroy off

# Aggressive resize plays nicely with multiple clients on different sizes.
setw -g aggressive-resize on
