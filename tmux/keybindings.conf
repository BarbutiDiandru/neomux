# -----------------------------------------------------------------------------
# Key bindings
# -----------------------------------------------------------------------------

# Reload config: prefix + r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "config reloaded"

# New window in current pane's directory.
bind c new-window -c "#{pane_current_path}"

# Pane resize with repeat (hold prefix, tap key).
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Window nav.
bind -r C-h previous-window
bind -r C-l next-window
bind Tab last-window

# Copy-mode: v to select, y to yank (plays with tmux-yank).
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Quick session picker.
bind s choose-tree -Zs

# Toggle synchronize-panes (send input to every pane in a window).
bind S set-window-option synchronize-panes
